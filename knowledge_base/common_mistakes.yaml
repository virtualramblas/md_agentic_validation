description: >
  Registry of common mistakes in GROMACS MDP file
  configuration. Used by the MDP validator to detect
  errors and warnings in proposed simulation setups.
  Each entry defines the mistake ID, severity, the
  condition that triggers it, the error message, and
  a correction suggestion.

metadata:
  version: "1.0"
  total_critical_errors: 12
  total_warnings: 8
  total_cross_phase: 3


critical_errors:
  - id: CM001
    name: Berendsen barostat in production MD
    category: barostat_thermostat
    severity: ERROR
    applicable_phases:
      - production_md
    check_condition: >
      pcoupl == berendsen AND
      phase == production_md
    message: >
      Berendsen barostat does not sample the correct
      NPT ensemble. It suppresses pressure fluctuations
      and produces incorrect compressibility and volume
      fluctuation statistics. Must not be used in
      production MD.
    correction_suggestion: >
      Change pcoupl to parrinello-rahman (recommended)
      or c-rescale (GROMACS 2021+). Both correctly
      sample the isothermal-isobaric ensemble.

  - id: CM002
    name: Position restraints active in production MD
    category: position_restraints
    severity: ERROR
    applicable_phases:
      - production_md
    check_condition: >
      define contains -DPOSRES AND
      phase == production_md
    message: >
      Position restraints are active in production MD.
      This artificially constrains the solute and
      prevents sampling of the true conformational
      ensemble. All structural and dynamic analysis
      from a restrained trajectory is invalid.
    correction_suggestion: >
      Remove define = -DPOSRES (or -DPOSRES_HEAVY)
      from the production MD MDP file. The define
      parameter should be empty or absent entirely
      in production MD.

  - id: CM003
    name: Velocity regeneration in continuation run
    category: velocity_generation
    severity: ERROR
    applicable_phases:
      - npt_equilibration
      - production_md
    check_condition: >
      gen-vel == yes AND
      continuation == yes
    message: >
      Velocities are being regenerated in a
      continuation run. This discards all previous
      equilibration and restarts the simulation from
      scratch, invalidating the entire equilibration
      procedure.
    correction_suggestion: >
      Set gen-vel = no. Velocities must be read from
      the checkpoint file specified with the -t flag
      in gmx grompp.

  - id: CM004
    name: No temperature coupling in MD simulation
    category: barostat_thermostat
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      tcoupl == no AND
      integrator == md
    message: >
      Temperature coupling is disabled in an MD
      simulation. Without a thermostat the system
      will not maintain the target temperature and
      energy will drift.
    correction_suggestion: >
      Set tcoupl to v-rescale (recommended for
      equilibration) or nose-hoover (recommended
      for production MD).

  - id: CM005
    name: Pressure coupling active during NVT
    category: barostat_thermostat
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
    check_condition: >
      pcoupl != no AND
      phase == nvt_equilibration
    message: >
      Pressure coupling is active during NVT
      equilibration. The NVT ensemble requires
      constant volume. Applying pressure coupling
      changes the ensemble to NPT and defeats the
      purpose of the NVT phase.
    correction_suggestion: >
      Set pcoupl = no in the NVT equilibration
      MDP file.

  - id: CM006
    name: CHARMM36 with standard TIP3P water
    category: force_field_water_compatibility
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      force_field contains charmm36 AND
      water_model == TIP3P (standard)
    message: >
      CHARMM36/36m requires CHARMM-modified TIP3P
      water, not standard TIP3P. Standard TIP3P
      lacks Lennard-Jones parameters on hydrogen
      atoms that CHARMM36 requires for correct
      non-bonded interactions.
    correction_suggestion: >
      Replace standard TIP3P with CHARMM-modified
      TIP3P (tip3p_charmm.itp). Rebuild the solvated
      system with the correct water model.

  - id: CM007
    name: CHARMM36 with DispCorr enabled
    category: force_field_mdp_compatibility
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      force_field contains charmm36 AND
      DispCorr != no
    message: >
      CHARMM36/36m uses Force-switch VdW modifier
      which already handles long-range VdW corrections.
      Enabling DispCorr double-counts the long-range
      correction and produces wrong energies and
      pressures.
    correction_suggestion: >
      Set DispCorr = no for all CHARMM36/36m
      simulations.

  - id: CM008
    name: Wrong VdW cutoff for CHARMM36
    category: force_field_mdp_compatibility
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      force_field contains charmm36 AND
      rvdw != 1.2
    message: >
      CHARMM36/36m requires rvdw = 1.2 nm with
      Force-switch modifier and rvdw-switch = 1.0 nm.
      Using a different cutoff is inconsistent with
      the force field parameterization.
    correction_suggestion: >
      Set rvdw = 1.2, rcoulomb = 1.2,
      vdw-modifier = Force-switch,
      rvdw-switch = 1.0 for CHARMM36/36m.

  - id: CM009
    name: Steepest descent integrator in MD phase
    category: integrator
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      integrator == steep AND
      phase != energy_minimization
    message: >
      Steepest descent integrator is being used in
      an MD phase. steep is an energy minimization
      algorithm, not an MD integrator. It does not
      propagate dynamics and cannot be used for
      equilibration or production MD.
    correction_suggestion: >
      Change integrator to md (leap-frog, standard)
      or sd (stochastic dynamics / Langevin).

  - id: CM010
    name: PME electrostatics not used
    category: electrostatics
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      coulombtype != PME AND
      phase != energy_minimization
    message: >
      PME (Particle Mesh Ewald) electrostatics are
      not being used. Cut-off electrostatics produce
      severe artifacts in condensed phase simulations
      including incorrect protein folding, wrong
      binding affinities, and unphysical dynamics.
    correction_suggestion: >
      Set coulombtype = PME for all explicit solvent
      MD simulations.

  - id: CM011
    name: No constraints with 2 fs timestep
    category: constraints
    severity: ERROR
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      constraints == none AND
      dt >= 0.002
    message: >
      No bond constraints are applied with a 2 fs
      timestep. Without h-bond constraints the
      fastest bond vibrations (O-H, N-H) require
      a timestep of 0.5-1.0 fs for stable
      integration. Using 2 fs without constraints
      will cause LINCS errors or simulation crashes.
    correction_suggestion: >
      Set constraints = h-bonds (minimum) for
      dt = 0.002 ps. Use all-bonds for higher
      accuracy.

  - id: CM012
    name: Berendsen thermostat in production MD
    category: barostat_thermostat
    severity: ERROR
    applicable_phases:
      - production_md
    check_condition: >
      tcoupl == berendsen AND
      phase == production_md
    message: >
      Berendsen thermostat does not sample the
      correct canonical ensemble. It suppresses
      kinetic energy fluctuations and produces
      incorrect heat capacity and temperature
      fluctuation statistics. Must not be used
      in production MD.
    correction_suggestion: >
      Change tcoupl to nose-hoover (recommended)
      or v-rescale for production MD.


warnings:
  - id: CM013
    name: No position restraints during NVT
    category: position_restraints
    severity: WARNING
    applicable_phases:
      - nvt_equilibration
    check_condition: >
      define does not contain -DPOSRES AND
      phase == nvt_equilibration
    message: >
      Position restraints are not active during
      NVT equilibration. Without restraints the
      solute may distort while the solvent
      equilibrates around it, potentially leading
      to unphysical starting conformations for
      production MD.
    correction_suggestion: >
      Add define = -DPOSRES to the NVT MDP file
      to restrain all heavy atoms during
      equilibration.

  - id: CM014
    name: No position restraints during NPT
    category: position_restraints
    severity: WARNING
    applicable_phases:
      - npt_equilibration
    check_condition: >
      define does not contain -DPOSRES AND
      phase == npt_equilibration
    message: >
      Position restraints are not active during
      NPT equilibration. The system needs time to
      equilibrate box volume and density with the
      solute restrained. Removing restraints before
      density has converged can lead to poor
      starting conditions for production MD.
    correction_suggestion: >
      Add define = -DPOSRES to the NPT MDP file.
      Remove restraints only in production MD.

  - id: CM015
    name: Short NVT equilibration
    category: simulation_length
    severity: WARNING
    applicable_phases:
      - nvt_equilibration
    check_condition: >
      nsteps * dt < 50.0 AND
      phase == nvt_equilibration
    message: >
      NVT equilibration is shorter than 50 ps.
      This may be insufficient for the system to
      reach thermal equilibrium, particularly for
      large or complex systems.
    correction_suggestion: >
      Use at least 100 ps (50000 steps with
      dt = 0.002 ps) for NVT equilibration.
      Use 500 ps for membrane or large systems.

  - id: CM016
    name: Short NPT equilibration
    category: simulation_length
    severity: WARNING
    applicable_phases:
      - npt_equilibration
    check_condition: >
      nsteps * dt < 50.0 AND
      phase == npt_equilibration
    message: >
      NPT equilibration is shorter than 50 ps.
      This may be insufficient for density
      convergence, particularly for large systems
      or systems with membranes.
    correction_suggestion: >
      Use at least 100 ps (50000 steps with
      dt = 0.002 ps) for NPT equilibration.
      Use 500 ps to 2 ns for membrane systems.

  - id: CM017
    name: Parrinello-Rahman barostat in NPT equilibration
    category: barostat_thermostat
    severity: WARNING
    applicable_phases:
      - npt_equilibration
    check_condition: >
      pcoupl == parrinello-rahman AND
      phase == npt_equilibration
    message: >
      Parrinello-Rahman barostat is being used
      during NPT equilibration. This barostat can
      cause large pressure oscillations and
      simulation instability when the system is
      far from the target pressure, which is
      common at the start of NPT equilibration.
    correction_suggestion: >
      Use berendsen or c-rescale for NPT
      equilibration. Switch to parrinello-rahman
      for production MD.

  - id: CM018
    name: AMBER force field without DispCorr
    category: force_field_mdp_compatibility
    severity: WARNING
    applicable_phases:
      - npt_equilibration
      - production_md
    check_condition: >
      force_field contains amber AND
      DispCorr == no
    message: >
      AMBER force fields require DispCorr = EnerPres
      for correct density and pressure in NPT
      simulations. Without dispersion correction
      the system density will be slightly incorrect.
    correction_suggestion: >
      Set DispCorr = EnerPres for all AMBER force
      field NPT and production MD simulations.

  - id: CM019
    name: AMBER force field with Force-switch VdW
    category: force_field_mdp_compatibility
    severity: WARNING
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      force_field contains amber AND
      vdw-modifier == Force-switch
    message: >
      AMBER force fields use Potential-shift VdW
      modifier, not Force-switch. Force-switch is
      specific to CHARMM force fields. Using
      Force-switch with AMBER gives inconsistent
      VdW treatment and wrong energies.
    correction_suggestion: >
      Set vdw-modifier = Potential-shift for all
      AMBER force field simulations.

  - id: CM020
    name: Large timestep without hydrogen mass repartitioning
    category: timestep
    severity: WARNING
    applicable_phases:
      - nvt_equilibration
      - npt_equilibration
      - production_md
    check_condition: >
      dt > 0.002 AND
      hydrogen_mass_repartitioning == false
    message: >
      A timestep larger than 2 fs is being used
      without hydrogen mass repartitioning (HMR).
      Timesteps above 2 fs require HMR to remain
      stable. Without HMR the fastest hydrogen
      bond vibrations will not be correctly
      integrated.
    correction_suggestion: >
      Either reduce dt to 0.002 ps, or apply
      hydrogen mass repartitioning using parmed
      before running the simulation and set
      constraints = h-bonds.


cross_phase_consistency_mistakes:
  CC001:
    id: CC001
    name: Temperature inconsistency across phases
    category: ensemble_consistency
    severity: ERROR
    check_condition: >
      ref-t(NVT) != ref-t(NPT) OR
      ref-t(NPT) != ref-t(production)
    message: >
      Target temperature is inconsistent across
      simulation phases. The ref-t value must be
      identical in NVT equilibration, NPT
      equilibration, and production MD. Inconsistent
      temperatures invalidate the equilibration
      and introduce thermodynamic discontinuities
      between phases.
    correction_suggestion: >
      Set ref-t to the same value in all MDP files.
      Standard physiological temperature is 300 K.

  CC002:
    id: CC002
    name: Pressure inconsistency across phases
    category: ensemble_consistency
    severity: ERROR
    check_condition: >
      ref-p(NPT) != ref-p(production)
    message: >
      Target pressure is inconsistent between NPT
      equilibration and production MD. The ref-p
      value must be identical in NPT equilibration
      and production MD. Inconsistent pressures
      introduce thermodynamic discontinuities
      between phases.
    correction_suggestion: >
      Set ref-p to the same value in NPT and
      production MD MDP files. Standard pressure
      is 1.0 bar.

  CC003:
    id: CC003
    name: Cutoff inconsistency across phases
    category: ensemble_consistency
    severity: WARNING
    check_condition: >
      rcoulomb(NVT) != rcoulomb(NPT) OR
      rcoulomb(NPT) != rcoulomb(production) OR
      rvdw(NVT) != rvdw(NPT) OR
      rvdw(NPT) != rvdw(production)
    message: >
      Electrostatic or VdW cutoffs are inconsistent
      across simulation phases. Changing cutoffs
      between phases introduces energy
      discontinuities and invalidates the
      equilibration.
    correction_suggestion: >
      Set rcoulomb and rvdw to identical values
      in all MDP files (EM, NVT, NPT, production).