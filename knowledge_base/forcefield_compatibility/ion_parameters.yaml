description: >
  Ion parameter sets available for GROMACS simulations.
  Organized under the parameter_sets key. Each entry
  defines the reference, ions covered, water models the
  parameters were developed with, and compatibility with
  force fields. Ion parameters must be matched to the
  water model used in the simulation — using ion
  parameters developed for a different water model
  produces incorrect ion hydration free energies and
  ion-protein interactions.

parameter_sets:

  Joung-Cheatham:
    reference: >
      Joung & Cheatham, J Phys Chem B 2008.
      DOI: 10.1021/jp8001614
    ions_covered:
      - Na+
      - K+
      - Rb+
      - Cs+
      - Li+
      - Cl-
      - Br-
      - I-
      - F-
    parameterized_with:
      - TIP3P
      - TIP4P-EW
      - SPC/E
    compatible_water_models:
      - TIP3P
      - TIP4P-EW
      - SPCE
    compatible_force_fields:
      - amber99sb
      - amber99sb-ildn
      - amber14sb
      - amber03
    not_recommended_with:
      - CHARMM36
      - CHARMM36m
      - GROMOS53a6
      - GROMOS54a7
    notes: >
      The most widely validated monovalent ion parameter
      set for AMBER force fields. Three separate
      parameter variants exist — one for each water
      model (TIP3P, TIP4P-EW, SPC/E). The correct
      variant MUST be used with the matching water
      model. Using the TIP3P variant with TIP4P-EW
      water (or vice versa) is a forbidden combination
      that produces incorrect ion hydration free
      energies. Specify the variant explicitly when
      setting up the simulation.

  Aqvist:
    reference: >
      Aqvist, J Phys Chem 1990.
      DOI: 10.1021/j100367a006
    ions_covered:
      - Na+
      - K+
      - Mg2+
      - Ca2+
      - Li+
      - Rb+
      - Cs+
    parameterized_with: SPC
    compatible_water_models:
      - SPC
      - SPCE
    compatible_force_fields:
      - gromos53a6
      - gromos54a7
      - gromos54a8
    not_recommended_with:
      - TIP3P
      - TIP4P
      - TIP4P-EW
      - AMBER force fields
    notes: >
      Standard ion parameter set for GROMOS force
      fields. Parameterized with SPC water. Acceptable
      with SPC/E. Must NOT be used with TIP3P or
      TIP4P water models — incorrect ion hydration
      free energies result. Not recommended for new
      AMBER simulations — use Joung-Cheatham instead.

  CHARMM36_ions:
    reference: >
      Beglov & Roux, J Chem Phys 1994.
      DOI: 10.1063/1.467468
      Updated: Roux group CHARMM36 ion parameters.
    ions_covered:
      - Na+
      - K+
      - Cl-
      - Ca2+
      - Mg2+
      - Cs+
      - Rb+
      - Li+
    parameterized_with: TIP3P-CHARMM
    compatible_water_models:
      - TIP3P-CHARMM
    compatible_force_fields:
      - charmm36
      - charmm36m
    not_recommended_with:
      - TIP3P
      - TIP4P-EW
      - SPCE
      - AMBER force fields
      - GROMOS force fields
    notes: >
      Ion parameters specifically developed for use
      with CHARMM36 and CHARMM36m force fields and
      CHARMM-modified TIP3P water. Must NOT be used
      with standard TIP3P (which lacks LJ parameters
      on hydrogen atoms). Must NOT be used with AMBER
      or GROMOS force fields. These are the only
      recommended ion parameters for CHARMM36/36m
      simulations.

  Li-Merz_12-6:
    reference: >
      Li, Merz et al., J Chem Theory Comput 2013.
      DOI: 10.1021/ct400146w
    model_type: 12-6 Lennard-Jones
    ions_covered:
      - Mg2+
      - Ca2+
      - Zn2+
      - Fe2+
      - Fe3+
      - Al3+
      - Ba2+
      - Sr2+
      - Cd2+
      - Cu2+
      - Ni2+
      - Co2+
      - Mn2+
      - Pb2+
      - Hg2+
      - Cr3+
      - In3+
      - Tl+
      - Ag+
    parameterized_with:
      - TIP3P
      - TIP4P-EW
      - SPCE
    compatible_water_models:
      - TIP3P
      - TIP4P-EW
      - SPCE
    compatible_force_fields:
      - amber99sb-ildn
      - amber14sb
    notes: >
      Standard 12-6 Lennard-Jones model for divalent
      and trivalent ions. Parameterized to reproduce
      ion-oxygen distances and coordination numbers.
      Simpler than the 12-6-4 model but less accurate
      for coordination geometry. Use when 12-6-4 is
      not available or when coordination geometry is
      not the primary scientific focus. Three separate
      parameter sets exist for TIP3P, TIP4P-EW, and
      SPC/E water — use the correct variant for your
      water model.

  Li-Merz_12-6-4:
    reference: >
      Li, Merz et al., J Chem Theory Comput 2013.
      DOI: 10.1021/ct400146w
    model_type: 12-6-4 (includes charge-induced dipole term)
    ions_covered:
      - Mg2+
      - Ca2+
      - Zn2+
      - Fe2+
      - Fe3+
      - Al3+
      - Ba2+
      - Sr2+
      - Cd2+
      - Cu2+
      - Ni2+
      - Co2+
      - Mn2+
      - Pb2+
      - Hg2+
      - Cr3+
      - In3+
      - Tl+
      - Ag+
    parameterized_with:
      - TIP3P
      - TIP4P-EW
      - SPCE
    compatible_water_models:
      - TIP3P
      - TIP4P-EW
      - SPCE
    compatible_force_fields:
      - amber14sb
    notes: >
      Most accurate model for divalent and trivalent
      ions. Includes a C4 term (charge-induced dipole
      interaction) that better reproduces ion
      coordination geometry, hydration free energies,
      and ion-protein interactions compared to the
      standard 12-6 model. Requires modified
      non-bonded interactions — not supported by all
      GROMACS versions. Verify GROMACS version
      compatibility before using. Strongly recommended
      for simulations where metal ion coordination
      is scientifically important (e.g. metalloenzymes,
      zinc finger proteins, calcium-binding proteins).
      Use 12-6 model if 12-6-4 is not available in
      your GROMACS version.

  Amber_monovalent_default:
    reference: >
      Cornell et al., J Am Chem Soc 1995.
      DOI: 10.1021/ja00124a002
    ions_covered:
      - Na+
      - Cl-
    parameterized_with: TIP3P
    compatible_water_models:
      - TIP3P
    compatible_force_fields:
      - amber99sb
      - amber99sb-ildn
    not_recommended_with:
      - TIP4P-EW
      - SPCE
      - CHARMM force fields
      - GROMOS force fields
    notes: >
      Simple default monovalent ion parameters
      included in early AMBER force field
      distributions. Acceptable for basic charge
      neutralization when ion behavior is not
      scientifically relevant. Joung-Cheatham
      parameters are strongly preferred for all
      new simulations — they are more accurate and
      better validated across a wider range of
      conditions.
    recommendation: >
      Use Joung-Cheatham parameters instead for
      all new simulations.


ion_naming_conventions:
  description: >
    Ion residue names differ between force field
    families. Using the wrong name causes fatal
    grompp errors. Always verify ion names match
    the force field being used before running
    gmx genion.

  amber:
    sodium: NA
    potassium: K
    chloride: CL
    calcium: CA
    magnesium: MG
    zinc: ZN
    notes: >
      AMBER ion names are short uppercase symbols
      without charge notation. NA and CL are the
      most commonly used. Verify with the force
      field .itp files if uncertain.

  charmm:
    sodium: SOD
    potassium: POT
    chloride: CLA
    calcium: CAL
    magnesium: MG
    zinc: ZN2
    notes: >
      CHARMM ion names use three-letter codes.
      SOD and CLA are the most commonly used.
      Do not use NA/CL with CHARMM force fields.

  gromos:
    sodium: "NA+"
    potassium: "K+"
    chloride: "CL-"
    calcium: "CA2+"
    magnesium: "MG2+"
    notes: >
      GROMOS ion names include charge notation.
      Verify with the force field .itp files
      as naming conventions vary between GROMOS
      versions.

  genion_flags:
    amber:
      pname: NA
      nname: CL
    charmm:
      pname: SOD
      nname: CLA
    gromos:
      pname: "NA+"
      nname: "CL-"
    notes: >
      Use these values for the -pname and -nname
      flags in gmx genion. Wrong values cause
      fatal topology errors during grompp.


ion_concentration_rules:
  description: >
    Rules for determining the correct salt
    concentration and ion counts.

  physiological_NaCl:
    concentration_mM: 150
    concentration_M: 0.15
    genion_flag: -conc 0.15
    notes: >
      150 mM NaCl is the standard physiological
      salt concentration. Always use both -neutral
      and -conc 0.15 flags together in gmx genion.
      -neutral ensures charge neutrality. -conc
      adds additional ions beyond neutralization
      to reach physiological concentration.

  minimum_requirements:
    always_neutralize: true
    minimum_counterions: 1
    warning_threshold_total_ions: 10
    notes: >
      The system MUST be charge-neutral before
      any MD simulation. Never leave a charged
      system without counterions. If total ion
      count is below 10, finite-size effects
      on electrostatic screening may be significant.

  nucleic_acid_requirements:
    minimum_monovalent_mM: 150
    recommended_monovalent_mM: 150
    magnesium_for_RNA_mM: 2.0
    notes: >
      Nucleic acids are highly negatively charged.
      Always add physiological salt concentration
      — never use neutralization only for nucleic
      acid simulations. Add 2-5 mM MgCl2 for RNA
      simulations unless studying Mg2+-free
      conditions explicitly.


ion_placement_rules:
  description: >
    Rules governing where ions are placed in the
    simulation box by gmx genion.

  minimum_distance_from_solute:
    from_protein_nm: 0.6
    from_membrane_nm: 0.5
    notes: >
      gmx genion handles minimum distance
      constraints automatically with default
      settings. Verify no ion is within 0.6 nm
      of any protein atom after genion completes.

  replacement_of_water:
    description: >
      gmx genion replaces randomly selected water
      molecules with ions. The topology water count
      must be updated accordingly.
    validation: >
      n_water_after = n_water_before
                    - n_positive_ions_added
                    - n_negative_ions_added

  structural_ions:
    description: >
      Structurally important ions (Zn2+ in zinc
      fingers, Ca2+ in calmodulin, Mg2+ in kinases)
      must be added BEFORE bulk ion addition and
      must NOT be replaced by genion.
    examples:
      - Zn2+ in zinc finger proteins
      - Ca2+ in calmodulin and EF-hand proteins
      - Mg2+ in kinase active sites
      - Fe2+/Fe3+ in iron-sulfur clusters
    parameterization_note: >
      Structural ions require special parameterization.
      Use Li-Merz 12-6-4 for Zn2+, Mg2+, Ca2+ where
      coordination geometry is scientifically important.


genion_protocol:
  description: >
    Step-by-step protocol for adding ions with
    gmx genion. Must be followed in this exact order.

  step_1_prepare_tpr:
    tool: gmx grompp
    purpose: >
      Generate a .tpr file for genion input.
      Uses a minimal MDP file — not the production
      MDP. The MDP parameters here do not affect
      the final simulation.
    minimal_mdp_settings:
      integrator: steep
      nsteps: 0
      cutoff-scheme: Verlet
      rcoulomb: 1.0
      rvdw: 1.0
      coulombtype: PME
    notes: >
      nsteps = 0 with steep integrator creates a
      valid .tpr without running any simulation.
      This is the standard approach for the genion
      preprocessing step.

  step_2_run_genion:
    tool: gmx genion
    required_flags:
      - flag: "-s"
        description: Input .tpr file from step 1
      - flag: "-o"
        description: Output structure with ions
      - flag: "-p"
        description: >
          Topology file — updated automatically
          by genion with correct ion counts and
          reduced water count
      - flag: "-pname"
        description: >
          Positive ion residue name — must match
          force field naming convention
      - flag: "-nname"
        description: >
          Negative ion residue name — must match
          force field naming convention
      - flag: "-neutral"
        description: >
          Add counterions to neutralize system
          charge — always use this flag
      - flag: "-conc"
        value_recommended: 0.15
        description: >
          Target salt concentration in mol/L —
          use 0.15 for physiological NaCl
    notes: >
      Always use both -neutral and -conc flags
      together. Never omit -p — the topology
      must be updated by genion.

  step_3_verify:
    checks:
      - total_system_charge_is_zero
      - water_count_correctly_reduced
      - ion_count_matches_target_concentration
      - ion_names_match_force_field_convention
      - no_ion_within_0_6_nm_of_protein