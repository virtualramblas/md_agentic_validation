nvt_equilibration:
  description: >
    Constant Number, Volume, Temperature ensemble. First equilibration phase.
    Purpose: bring system to target temperature while keeping volume fixed.
    Position restraints on heavy atoms of solute are strongly recommended.
    Must follow successful energy minimization.

  prerequisites:
    must_follow: energy_minimization
    required_input_files:
      - em_output.gro
      - topology.top
      - posre.itp
    posre_itp_required: true
    notes: >
      Position restraint file (posre.itp) must be generated and included
      in topology. Restraints prevent solute from moving while solvent
      equilibrates around it.

  run_control:
    parameters:
      integrator:
        type: enum
        required: true
        allowed_values: [md, sd]
        recommended: md
        forbidden_values: [steep, cg, l-bfgs, bd]
        notes: >
          md (leap-frog) is standard. sd (stochastic dynamics / Langevin)
          is an alternative that includes thermostat implicitly but changes
          the dynamics character. Use md with explicit thermostat for
          standard NVT equilibration.

      dt:
        type: float
        required: true
        min: 0.001
        max: 0.002
        recommended: 0.002
        unit: ps
        notes: >
          2 fs (0.002 ps) is standard with hydrogen bond constraints
          (h-bonds or all-bonds). Reduce to 1 fs if constraints=none
          or if system is unstable. Never exceed 2 fs without
          h-mass repartitioning.
        depends_on:
          constraints:
            parameter: constraints
            if_value: none
            then_max: 0.001

      nsteps:
        type: integer
        required: true
        min: 25000
        max: 500000
        recommended: 50000
        unit: steps
        derived_time:
          formula: nsteps * dt
          min_time_ps: 50.0
          recommended_time_ps: 100.0
        notes: >
          Minimum 50 ps (25000 steps at 2 fs) for simple systems.
          100 ps (50000 steps) recommended as standard. Complex or
          large systems may require 500 ps - 1 ns. Insufficient
          equilibration leads to artifacts in subsequent NPT phase.

      comm-mode:
        type: enum
        required: false
        allowed_values: [Linear, Angular, None]
        recommended: Linear
        notes: >
          Remove center of mass translation. Linear is standard.
          Angular removal not recommended for periodic systems.

      nstcomm:
        type: integer
        required: false
        min: 1
        max: 100
        recommended: 100
        notes: Frequency of COM motion removal. Every 100 steps is standard.

  output_control:
    parameters:
      nstxout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Full precision coordinate output. Set to 0 and use compressed
          output (nstxout-compressed) instead to save disk space.

      nstvout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: Velocity output. Not needed for equilibration analysis.

      nstlog:
        type: integer
        required: true
        min: 100
        max: 5000
        recommended: 500
        notes: >
          Log file output frequency. Every 500 steps (1 ps at 2 fs)
          is standard.

      nstenergy:
        type: integer
        required: true
        min: 100
        max: 5000
        recommended: 500
        notes: >
          Energy file output frequency. 500 steps allows monitoring of
          temperature convergence during NVT.

      nstxout-compressed:
        type: integer
        required: false
        min: 0
        max: 5000
        recommended: 500
        notes: >
          Compressed trajectory output. 500 steps (1 ps) is sufficient
          for equilibration monitoring. Not critical for analysis.

  neighbor_searching:
    parameters:
      cutoff-scheme:
        type: enum
        required: true
        allowed_values: [Verlet]
        forbidden_values: [group]
        notes: Same as EM — Verlet mandatory.

      nstlist:
        type: integer
        required: true
        min: 10
        max: 40
        recommended: 10
        notes: >
          10 is standard with Verlet scheme. GROMACS auto-adjusts nstlist
          with Verlet scheme for optimal performance. Values up to 40
          acceptable for GPU-accelerated runs.

      rlist:
        type: float
        required: false
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        notes: Auto-adjusted by GROMACS with Verlet scheme.

  electrostatics:
    parameters:
      coulombtype:
        type: enum
        required: true
        allowed_values: [PME]
        recommended: PME
        forbidden_values: [Cut-off]
        notes: >
          PME mandatory for explicit solvent NVT. Cut-off is not
          acceptable for production-quality equilibration of
          solvated biomolecular systems.

      rcoulomb:
        type: float
        required: true
        min: 0.9
        max: 1.2
        recommended: 1.0
        unit: nm
        must_equal: rvdw
        notes: 1.0 nm standard. Must match rvdw with Verlet scheme.

      pme-order:
        type: integer
        required: false
        min: 4
        max: 6
        recommended: 4
        notes: 4 (cubic interpolation) is standard and sufficient.

      fourierspacing:
        type: float
        required: false
        min: 0.10
        max: 0.16
        recommended: 0.16
        unit: nm

  vdw:
    parameters:
      vdwtype:
        type: enum
        required: true
        allowed_values: [Cut-off]
        recommended: Cut-off
        notes: Cut-off with dispersion correction is standard.

      rvdw:
        type: float
        required: true
        min: 0.9
        max: 1.2
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb

      vdw-modifier:
        type: enum
        required: false
        allowed_values: [Potential-shift]
        recommended: Potential-shift

      DispCorr:
        type: enum
        required: false
        allowed_values: [EnerPres, Ener, no]
        recommended: EnerPres
        notes: >
          EnerPres recommended. Applies long-range dispersion correction
          to both energy and pressure. Important for density accuracy.

  temperature_coupling:
    parameters:
      tcoupl:
        type: enum
        required: true
        allowed_values: [v-rescale, nose-hoover]
        recommended: v-rescale
        forbidden_values: [no, berendsen, andersen]
        notes: >
          v-rescale (velocity rescaling with stochastic term) is recommended
          for equilibration — correctly samples canonical ensemble.
          Berendsen is forbidden: does not produce correct NVT ensemble
          and suppresses energy fluctuations.
          nose-hoover acceptable but has longer equilibration time and
          can oscillate — better suited for production.

      tc-grps:
        type: string
        required: true
        recommended_values:
          - "Protein Non-Protein"
          - "Protein_DNA Non-Protein"
        notes: >
          Separate temperature coupling groups for solute and solvent
          are strongly recommended. Coupling everything together can
          mask energy transfer problems between solute and solvent.
          Use 'Protein Non-Protein' for standard protein-water systems.

      tau-t:
        type: float
        required: true
        min: 0.01
        max: 2.0
        recommended: 0.1
        unit: ps
        notes: >
          Temperature coupling time constant. 0.1 ps is standard for
          equilibration with v-rescale. Values below 0.05 ps cause
          over-coupling and unphysical dynamics. Values above 1.0 ps
          result in slow temperature convergence during equilibration.
          One value required per tc-grps entry.

      ref-t:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        notes: >
          Target temperature. 300 K (27°C) is standard for physiological
          simulations. Must match across all tc-grps entries.
          One value required per tc-grps entry.

  pressure_coupling:
    parameters:
      pcoupl:
        type: enum
        required: true
        allowed_values: [no]
        forbidden_values: [berendsen, parrinello-rahman,
                           mttk, c-rescale]
        notes: >
          MUST be 'no' during NVT equilibration. Volume is fixed by
          definition in the NVT ensemble. Applying pressure coupling
          here would change the ensemble and defeat the purpose of NVT.

  velocity_generation:
    parameters:
      gen-vel:
        type: enum
        required: true
        allowed_values: [yes]
        forbidden_values: [no]
        notes: >
          MUST be 'yes' for NVT — velocities must be generated from
          Maxwell-Boltzmann distribution at ref-t. This is the first
          MD phase so no prior velocities exist.

      gen-temp:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        must_equal: ref-t
        notes: >
          Must equal ref-t. Generating velocities at a different
          temperature than the target causes immediate thermostat
          correction and wastes equilibration time.

      gen-seed:
        type: integer
        required: false
        min: -1
        max: 2147483647
        recommended: -1
        notes: >
          -1 uses a random seed (recommended for reproducibility testing).
          Set a fixed positive integer for fully reproducible runs.

  constraints:
    parameters:
      constraints:
        type: enum
        required: true
        allowed_values: [h-bonds, all-bonds, h-angles]
        recommended: h-bonds
        forbidden_values: [none]
        notes: >
          h-bonds (constrain all bonds involving hydrogen) is standard
          and enables 2 fs timestep. 'none' is forbidden with dt=0.002
          as it would require dt <= 0.001 for stability and is inefficient.
          all-bonds constrains all bonds — slightly more stable but
          removes bond vibration information.

      constraint-algorithm:
        type: enum
        required: true
        allowed_values: [LINCS, SHAKE]
        recommended: LINCS
        notes: >
          LINCS (Linear Constraint Solver) is faster and more stable
          than SHAKE for most systems. Use SHAKE only for systems with
          angle constraints or special requirements.

      lincs-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          Accuracy of LINCS. 4 is standard. Increase to 6-8 if LINCS
          warnings appear in log file during equilibration.

      lincs-iter:
        type: integer
        required: false
        min: 1
        max: 4
        recommended: 1
        notes: >
          Number of LINCS correction iterations. 1 is standard.
          Increase to 2 if LINCS warnings persist after increasing
          lincs-order.

  position_restraints:
    parameters:
      define:
        type: string
        required: true
        allowed_values: ["-DPOSRES", "-DPOSRES_HEAVY"]
        recommended: "-DPOSRES"
        notes: >
          Position restraints MUST be applied during NVT equilibration.
          -DPOSRES activates restraints defined in posre.itp (typically
          1000 kJ/mol/nm² on all heavy atoms). This prevents solute
          from moving while solvent equilibrates around it.
          Omitting position restraints during NVT is a common and
          serious mistake that leads to poor equilibration.