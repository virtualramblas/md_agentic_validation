nvt_equilibration:
  description: >
    NVT (constant Number of particles, Volume,
    Temperature) equilibration phase. Brings the system
    to the target temperature at constant volume before
    pressure coupling is introduced. Must follow energy
    minimization. Position restraints on solute heavy
    atoms are strongly recommended to prevent solute
    distortion while the solvent equilibrates around it.
    No pressure coupling. Velocities must be generated
    from a Maxwell-Boltzmann distribution.

  prerequisites:
    must_follow: energy_minimization
    required_input_files:
      - em.gro
      - topol.top
      - posre.itp
    continuation: false
    posre_itp_required: true
    notes: >
      NVT equilibration always follows energy
      minimization. No checkpoint file from EM is
      required — velocities are generated fresh.
      The posre.itp file must exist and be included
      in the topology for position restraints to work.

  run_control:
    parameters:
      integrator:
        type: enum
        required: true
        allowed_values:
          - md
          - sd
        forbidden_values:
          - steep
          - cg
          - l-bfgs
        recommended: md
        notes: >
          md (leap-frog integrator) is the standard
          choice for NVT equilibration. sd (stochastic
          dynamics / Langevin) is an alternative that
          combines integration with thermostatting but
          is less commonly used for equilibration.

      nsteps:
        type: integer
        required: true
        min: 25000
        max: 500000
        recommended: 50000
        notes: >
          Number of MD steps. With dt = 0.002 ps,
          50000 steps = 100 ps. 100 ps is the minimum
          recommended NVT equilibration time for simple
          protein-water systems. Use 200-500 ps for
          larger or more complex systems.

      dt:
        type: float
        required: true
        min: 0.0005
        max: 0.004
        recommended: 0.002
        unit: ps
        notes: >
          Integration timestep. 0.002 ps (2 fs) is
          standard when hydrogen bond constraints are
          applied. Use 0.001 ps (1 fs) if constraints
          are disabled. Do not exceed 0.002 ps without
          hydrogen mass repartitioning.

  output_control:
    parameters:
      nstlog:
        type: integer
        required: true
        min: 100
        max: 10000
        recommended: 500
        notes: >
          Write to log file every nstlog steps.
          500 steps = 1 ps with dt = 0.002 ps.

      nstenergy:
        type: integer
        required: true
        min: 100
        max: 10000
        recommended: 500
        notes: >
          Write energies to .edr file every nstenergy
          steps. 500 is standard for NVT equilibration.

      nstxout-compressed:
        type: integer
        required: true
        min: 0
        max: 10000
        recommended: 500
        notes: >
          Write compressed trajectory every N steps.
          500 steps = 1 ps with dt = 0.002 ps.
          Sufficient for monitoring equilibration.

  neighbor_searching:
    parameters:
      cutoff-scheme:
        type: enum
        required: true
        allowed_values:
          - Verlet
        forbidden_values:
          - group
        recommended: Verlet
        notes: >
          Verlet is mandatory. The group scheme is
          deprecated and removed in GROMACS 2021+.

      nstlist:
        type: integer
        required: true
        min: 10
        max: 40
        recommended: 10
        notes: >
          Update neighbor list every nstlist steps.
          10 is standard with the Verlet scheme.
          GROMACS may adjust this automatically for
          performance with the Verlet scheme.

      rcoulomb:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        notes: >
          Coulomb cutoff. Must equal rvdw when using
          Verlet scheme. 1.0 nm for AMBER/OPLS/GROMOS.
          1.2 nm for CHARMM36/36m.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb
        notes: >
          VdW cutoff. Must equal rcoulomb when using
          Verlet scheme.

      pbc:
        type: enum
        required: true
        allowed_values:
          - xyz
        forbidden_values:
          - "no"
          - xy
        recommended: xyz
        notes: >
          Full 3D periodic boundary conditions.
          Mandatory for all explicit solvent simulations.

  electrostatics:
    parameters:
      coulombtype:
        type: enum
        required: true
        allowed_values:
          - PME
        forbidden_values:
          - Cut-off
          - Reaction-Field
        recommended: PME
        notes: >
          PME is mandatory for all explicit solvent
          MD simulations. Cut-off electrostatics
          produces severe artifacts in condensed
          phase simulations.

      pme-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          PME interpolation order. 4 (cubic) is
          standard and sufficient.

      fourierspacing:
        type: float
        required: false
        min: 0.1
        max: 0.2
        recommended: 0.16
        unit: nm
        notes: >
          Grid spacing for PME FFT. 0.16 nm is
          standard.

  vdw:
    parameters:
      vdwtype:
        type: enum
        required: true
        allowed_values:
          - Cut-off
          - PME
        recommended: Cut-off
        notes: >
          Cut-off with dispersion correction is
          standard for most force fields.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb

      vdw-modifier:
        type: enum
        required: false
        allowed_values:
          - Potential-shift
          - Force-switch
          - Potential-switch
          - None
        recommended: Potential-shift
        notes: >
          Potential-shift for AMBER/OPLS/GROMOS.
          Force-switch for CHARMM36/36m.

      DispCorr:
        type: enum
        required: false
        allowed_values:
          - "no"
          - EnerPres
          - Ener
        recommended: EnerPres
        notes: >
          Long-range dispersion correction. EnerPres
          for AMBER/OPLS/GROMOS. Must be "no" for
          CHARMM36/36m.

  temperature_coupling:
    parameters:
      tcoupl:
        type: enum
        required: true
        allowed_values:
          - v-rescale
          - berendsen
          - nose-hoover
          - andersen
        forbidden_values:
          - "no"
        recommended: v-rescale
        notes: >
          Temperature coupling is mandatory during
          NVT equilibration. v-rescale is the
          recommended thermostat — it correctly
          samples the canonical ensemble and converges
          faster than Nose-Hoover during equilibration.
          Berendsen is acceptable for equilibration
          only. Nose-Hoover is correct but converges
          more slowly when far from equilibrium.
          MUST NOT be "no".

      tc-grps:
        type: string
        required: true
        allowed_values:
          - Protein Non-Protein
          - Protein_DNA Non-Protein
          - System
        recommended: Protein Non-Protein
        notes: >
          Separate temperature coupling groups for
          solute and solvent are strongly recommended.
          "Protein Non-Protein" applies separate
          thermostats to the protein and the solvent
          (water + ions). Using "System" as a single
          group can mask energy transfer problems.

      tau-t:
        type: float
        required: true
        min: 0.01
        max: 2.0
        recommended: 0.1
        unit: ps
        notes: >
          Temperature coupling time constant.
          0.1 ps is standard for v-rescale during
          equilibration. Use 0.5-1.0 ps for
          Nose-Hoover in production.

      ref-t:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        notes: >
          Target temperature. Must be identical
          across all MD phases (NVT, NPT, production).
          Standard physiological temperature is 300 K
          (approximately 27 degrees C). Use 310 K for
          human body temperature simulations.

  pressure_coupling:
    parameters:
      pcoupl:
        type: enum
        required: true
        allowed_values:
          - "no"
        forbidden_values:
          - berendsen
          - parrinello-rahman
          - mttk
          - c-rescale
        recommended: "no"
        notes: >
          MUST be "no" during NVT equilibration.
          The NVT ensemble requires constant volume.
          Applying pressure coupling changes the
          ensemble to NPT and defeats the purpose
          of the NVT phase.

  velocity_generation:
    parameters:
      gen-vel:
        type: enum
        required: true
        allowed_values:
          - "yes"
        forbidden_values:
          - "no"
        recommended: "yes"
        notes: >
          MUST be "yes" for NVT equilibration.
          Velocities are generated from a
          Maxwell-Boltzmann distribution at gen-temp.
          This is the first MD phase so no checkpoint
          velocities are available.

      gen-temp:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        must_equal: ref-t
        notes: >
          Temperature for Maxwell-Boltzmann velocity
          generation. MUST equal ref-t exactly.
          Generating velocities at a different
          temperature than the thermostat target
          causes an immediate thermostat correction
          and wastes equilibration time.

      gen-seed:
        type: integer
        required: false
        min: -1
        max: 2147483647
        recommended: -1
        notes: >
          Random seed for velocity generation.
          -1 uses a random seed based on the system
          clock. Use a fixed positive integer for
          reproducible simulations.

  constraints:
    parameters:
      constraints:
        type: enum
        required: true
        allowed_values:
          - h-bonds
          - all-bonds
          - h-angles
          - all-angles
        forbidden_values:
          - none
        recommended: h-bonds
        notes: >
          h-bonds is the standard choice for MD with
          dt = 0.002 ps. Constrains all bonds involving
          hydrogen atoms, allowing the 2 fs timestep.
          "none" is forbidden with dt > 0.001 ps as
          it would require a timestep of 1 fs or less
          for stable integration of H-bond vibrations.

      constraint-algorithm:
        type: enum
        required: false
        allowed_values:
          - LINCS
          - SHAKE
        recommended: LINCS
        notes: >
          LINCS is preferred over SHAKE for stability
          and performance. SHAKE is only needed for
          angle constraints.

      lincs-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          LINCS constraint order. 4 is standard.
          Increase to 6 for higher accuracy in
          production simulations.

      lincs-iter:
        type: integer
        required: false
        min: 1
        max: 4
        recommended: 1
        notes: >
          Number of LINCS correction iterations.
          1 is standard. Increase to 2 if LINCS
          warnings appear during simulation.

  position_restraints:
    parameters:
      define:
        type: string
        required: false
        allowed_values:
          - -DPOSRES
          - -DPOSRES_HEAVY
          - ""
        recommended: -DPOSRES
        notes: >
          Position restraints are strongly recommended
          during NVT equilibration. -DPOSRES restrains
          all heavy atoms with force constant typically
          1000 kJ/mol/nm². This prevents solute
          distortion while the solvent equilibrates
          around it. Omitting position restraints
          during NVT may lead to unphysical solute
          conformations before the system reaches
          thermal equilibrium.