energy_minimization:
  description: >
    Energy minimization phase. Removes steric clashes and
    unfavorable geometry from the initial structure before
    any MD simulation. Must always precede equilibration.
    No temperature or pressure coupling. No velocity
    generation. Position restraints optional but
    recommended for solvated systems.

  prerequisites:
    must_follow: null
    required_input_files:
      - processed.gro
      - topol.top
      - posre.itp
    continuation: false
    posre_itp_required: true
    notes: >
      Energy minimization is always the first step.
      No checkpoint file required. The input structure
      may have steric clashes — EM will resolve them.

  run_control:
    parameters:
      integrator:
        type: enum
        required: true
        allowed_values:
          - steep
          - cg
          - l-bfgs
        recommended: steep
        notes: >
          steep (steepest descent) is the standard choice.
          Robust and reliable for removing clashes.
          cg (conjugate gradient) is more accurate but
          slower and less robust for highly strained
          structures. l-bfgs is the most accurate but
          rarely needed for standard EM.

      nsteps:
        type: integer
        required: true
        min: 100
        max: 100000
        recommended: 50000
        notes: >
          Maximum number of minimization steps. EM
          terminates when emtol is reached OR nsteps
          is exceeded, whichever comes first. 50000
          is sufficient for most systems. Increase to
          100000 for large or highly strained systems.

      emtol:
        type: float
        required: true
        min: 1.0
        max: 1000.0
        recommended: 1000.0
        unit: kJ/mol/nm
        notes: >
          Convergence criterion. EM stops when maximum
          force on any atom falls below emtol. 1000
          kJ/mol/nm is standard for pre-MD minimization.
          Use 100 kJ/mol/nm for higher quality EM before
          sensitive calculations.

      emstep:
        type: float
        required: false
        min: 0.0001
        max: 0.1
        recommended: 0.01
        unit: nm
        notes: >
          Initial step size for steepest descent.
          0.01 nm is the standard value. Reduce to
          0.001 nm if EM is unstable or diverging.

  output_control:
    parameters:
      nstlog:
        type: integer
        required: true
        min: 1
        max: 10000
        recommended: 500
        notes: >
          Write to log file every nstlog steps.
          500 is standard for EM.

      nstenergy:
        type: integer
        required: true
        min: 1
        max: 10000
        recommended: 500
        notes: >
          Write energies to .edr file every nstenergy
          steps. 500 is standard for EM.

      nstxout-compressed:
        type: integer
        required: false
        min: 0
        max: 10000
        recommended: 500
        notes: >
          Write compressed trajectory every N steps.
          500 is standard for EM. Set to 0 to disable
          trajectory output during EM.

  neighbor_searching:
    parameters:
      cutoff-scheme:
        type: enum
        required: true
        allowed_values:
          - Verlet
        forbidden_values:
          - group
        recommended: Verlet
        notes: >
          Verlet is mandatory. The group scheme is
          deprecated and removed in GROMACS 2021+.

      nstlist:
        type: integer
        required: true
        min: 1
        max: 100
        recommended: 1
        notes: >
          Update neighbor list every nstlist steps.
          1 is recommended for EM — update every step
          for maximum accuracy during minimization.

      rcoulomb:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        notes: >
          Coulomb cutoff. Must equal rvdw when using
          Verlet scheme. 1.0 nm for AMBER/OPLS/GROMOS.
          1.2 nm for CHARMM36/36m.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb
        notes: >
          VdW cutoff. Must equal rcoulomb when using
          Verlet scheme.

      pbc:
        type: enum
        required: true
        allowed_values:
          - xyz
        forbidden_values:
          - "no"
          - xy
        recommended: xyz
        notes: >
          Full 3D periodic boundary conditions.
          Mandatory for all explicit solvent simulations.

  electrostatics:
    parameters:
      coulombtype:
        type: enum
        required: true
        allowed_values:
          - PME
          - Cut-off
        recommended: PME
        notes: >
          PME (Particle Mesh Ewald) is strongly
          recommended for all explicit solvent
          simulations. Cut-off is only acceptable
          for vacuum or implicit solvent simulations.

      pme-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          PME interpolation order. 4 (cubic) is
          standard and sufficient for EM.

      fourierspacing:
        type: float
        required: false
        min: 0.1
        max: 0.2
        recommended: 0.16
        unit: nm
        notes: >
          Grid spacing for PME FFT. 0.16 nm is
          standard. Smaller values increase accuracy
          but also computational cost.

  vdw:
    parameters:
      vdwtype:
        type: enum
        required: true
        allowed_values:
          - Cut-off
          - PME
        recommended: Cut-off
        notes: >
          Cut-off with dispersion correction is
          standard for most force fields.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb

      vdw-modifier:
        type: enum
        required: false
        allowed_values:
          - Potential-shift
          - Force-switch
          - Potential-switch
          - None
        recommended: Potential-shift
        notes: >
          Potential-shift for AMBER/OPLS/GROMOS.
          Force-switch for CHARMM36/36m.

      DispCorr:
        type: enum
        required: false
        allowed_values:
          - "no"
          - EnerPres
          - Ener
        recommended: EnerPres
        notes: >
          Long-range dispersion correction. EnerPres
          for AMBER/OPLS/GROMOS. Must be "no" for
          CHARMM36/36m (Force-switch handles LR VdW).

  temperature_coupling:
    parameters:
      tcoupl:
        type: enum
        required: true
        allowed_values:
          - "no"
        forbidden_values:
          - berendsen
          - v-rescale
          - nose-hoover
          - andersen
        recommended: "no"
        notes: >
          MUST be "no" during energy minimization.
          Temperature coupling is meaningless and
          harmful during EM.

  pressure_coupling:
    parameters:
      pcoupl:
        type: enum
        required: true
        allowed_values:
          - "no"
        forbidden_values:
          - berendsen
          - parrinello-rahman
          - mttk
          - c-rescale
        recommended: "no"
        notes: >
          MUST be "no" during energy minimization.
          Pressure coupling is meaningless and
          harmful during EM.

  velocity_generation:
    parameters:
      gen-vel:
        type: enum
        required: true
        allowed_values:
          - "no"
        forbidden_values:
          - "yes"
        recommended: "no"
        notes: >
          MUST be "no". Velocities are irrelevant
          during energy minimization.

  constraints:
    parameters:
      constraints:
        type: enum
        required: true
        allowed_values:
          - none
          - h-bonds
          - all-bonds
          - h-angles
          - all-angles
        recommended: none
        notes: >
          "none" is recommended for EM — constraints
          can interfere with minimization of strained
          geometries. h-bonds is acceptable if the
          starting structure is already reasonable.

      constraint-algorithm:
        type: enum
        required: false
        allowed_values:
          - LINCS
          - SHAKE
        recommended: LINCS
        notes: >
          LINCS is preferred over SHAKE for stability
          and performance.

  position_restraints:
    parameters:
      define:
        type: string
        required: false
        allowed_values:
          - ""
          - -DPOSRES
          - -DPOSRES_HEAVY
        recommended: -DPOSRES
        notes: >
          Position restraints are optional during EM
          but recommended for solvated systems to
          prevent solvent from entering the protein
          core during minimization. Use -DPOSRES to
          restrain all heavy atoms.