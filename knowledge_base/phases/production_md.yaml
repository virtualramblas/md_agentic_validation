production_md:
  description: >
    The actual data-collection phase. All analysis is performed on this
    trajectory. No position restraints. Ensemble must correctly sample
    the NPT or NVT statistical mechanical ensemble. Must follow successful
    NPT equilibration with converged density and pressure.

  prerequisites:
    must_follow: npt_equilibration
    required_input_files:
      - npt_output.gro
      - npt_output.cpt
      - topology.top
    continuation: true
    convergence_checks_required:
      density_converged: true
      pressure_converged: true
      temperature_converged: true
    notes: >
      Do NOT start production MD if NPT density has not converged.
      Check density plot from NPT — it should be stable with small
      fluctuations around ~1.0 g/cm³ for aqueous protein systems.

  run_control:
    parameters:
      integrator:
        type: enum
        required: true
        allowed_values: [md, sd]
        recommended: md
        forbidden_values: [steep, cg, l-bfgs, bd]
        notes: >
          md (leap-frog) is standard for production. sd (Langevin dynamics)
          is an alternative that provides implicit thermostatting but
          alters the dynamics — use only if explicitly required by the
          scientific question (e.g., enhanced sampling, implicit solvent
          comparison).

      dt:
        type: float
        required: true
        min: 0.001
        max: 0.004
        recommended: 0.002
        unit: ps
        notes: >
          2 fs standard with h-bonds constraints. 4 fs possible with
          hydrogen mass repartitioning (HMR) — requires modified topology.
          Never exceed 2 fs without HMR. Maintain consistency with
          equilibration phases.
        depends_on:
          constraints:
            parameter: constraints
            if_value: h-bonds
            then_max: 0.002
          hmr_applied:
            parameter: hmr_applied
            if_value: true
            then_max: 0.004

      nsteps:
        type: integer
        required: true
        min: 500000
        max: 50000000000
        recommended: 5000000
        unit: steps
        derived_time:
          formula: nsteps * dt
          min_time_ns: 1.0
          recommended_time_ns: 10.0
          notes: >
            Minimum 1 ns for any meaningful analysis. 10-100 ns for
            standard protein conformational studies. 1+ µs for folding
            or large conformational changes. The required simulation
            length is highly system- and question-dependent.

      continuation:
        type: enum
        required: true
        allowed_values: [yes]
        forbidden_values: [no]
        notes: >
          MUST be 'yes' — continuing from NPT checkpoint. Ensures
          correct velocities and box dimensions from equilibrated state.

      comm-mode:
        type: enum
        required: false
        allowed_values: [Linear]
        recommended: Linear
        notes: >
          Linear COM removal is important for production to prevent
          artificial drift of the system. Angular removal not recommended
          for periodic boundary condition systems.

      nstcomm:
        type: integer
        required: false
        min: 10
        max: 100
        recommended: 100
        notes: Frequency of COM motion removal. Every 100 steps is standard.

  output_control:
    parameters:
      nstxout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Full precision output not recommended — use compressed output.
          Set to non-zero only if full precision coordinates are needed
          for specific analysis (e.g., free energy calculations).

      nstvout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Velocity output rarely needed for standard analysis.
          Enable only for specific analyses requiring velocities
          (e.g., velocity autocorrelation functions).

      nstfout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Force output generates very large files. Disable unless
          required for specific analysis.

      nstlog:
        type: integer
        required: true
        min: 500
        max: 10000
        recommended: 5000
        notes: >
          Less frequent logging acceptable for long production runs.
          5000 steps (10 ps at 2 fs) is standard.

      nstenergy:
        type: integer
        required: true
        min: 500
        max: 10000
        recommended: 5000
        notes: >
          Energy output for monitoring simulation health during production.
          5000 steps (10 ps) provides sufficient resolution for drift
          detection.

      nstxout-compressed:
        type: integer
        required: true
        min: 500
        max: 50000
        recommended: 5000
        unit: steps
        derived_time:
          formula: nstxout-compressed * dt
          recommended_interval_ps: 10.0
        notes: >
          Primary trajectory output for analysis. 5000 steps (10 ps at
          2 fs) is standard — provides good time resolution without
          excessive file sizes. For fast processes (< 1 ns timescale),
          reduce to 500-1000 steps. For very long runs (> 1 µs), increase
          to 10000-50000 steps.

      compressed-x-grps:
        type: string
        required: false
        recommended_values: [System, Protein]
        notes: >
          Writing only 'Protein' instead of 'System' dramatically reduces
          trajectory file size for large solvated systems. Acceptable if
          solvent analysis is not required. Use 'System' if water structure
          or ion dynamics are part of the analysis.

  neighbor_searching:
    parameters:
      cutoff-scheme:
        type: enum
        required: true
        allowed_values: [Verlet]
        forbidden_values: [group]
        notes: Verlet mandatory — same as all other phases.

      nstlist:
        type: integer
        required: true
        min: 10
        max: 80
        recommended: 10
        notes: >
          10 is standard. GROMACS auto-tunes nstlist with Verlet scheme
          for GPU runs (typically increases to 20-80 for better GPU
          utilization). Allow auto-tuning for production runs.

      rlist:
        type: float
        required: false
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        notes: Auto-adjusted by GROMACS with Verlet scheme.

  electrostatics:
    parameters:
      coulombtype:
        type: enum
        required: true
        allowed_values: [PME]
        forbidden_values: [Cut-off, Reaction-Field]
        notes: >
          PME is mandatory for production MD of solvated biomolecular
          systems. No exceptions for standard protein-water simulations.
          Must be consistent with equilibration phases.

      rcoulomb:
        type: float
        required: true
        min: 0.9
        max: 1.2
        recommended: 1.0
        unit: nm
        must_equal: rvdw
        notes: >
          Must be consistent with equilibration phases. Changing cutoff
          between equilibration and production introduces artifacts.

      pme-order:
        type: integer
        required: false
        min: 4
        max: 6
        recommended: 4
        notes: Must be consistent with equilibration phases.

      fourierspacing:
        type: float
        required: false
        min: 0.10
        max: 0.16
        recommended: 0.16
        unit: nm
        notes: Must be consistent with equilibration phases.

  vdw:
    parameters:
      vdwtype:
        type: enum
        required: true
        allowed_values: [Cut-off]
        recommended: Cut-off
        notes: Must be consistent with equilibration phases.

      rvdw:
        type: float
        required: true
        min: 0.9
        max: 1.2
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb
        notes: Must be consistent with equilibration phases.

      vdw-modifier:
        type: enum
        required: false
        allowed_values: [Potential-shift]
        recommended: Potential-shift
        notes: Must be consistent with equilibration phases.

      DispCorr:
        type: enum
        required: true
        allowed_values: [EnerPres]
        recommended: EnerPres
        forbidden_values: [no]
        notes: >
          Mandatory for NPT production. Critical for correct density,
          pressure, and thermodynamic properties.

  temperature_coupling:
    parameters:
      tcoupl:
        type: enum
        required: true
        allowed_values: [v-rescale, nose-hoover]
        recommended: nose-hoover
        forbidden_values: [no, berendsen, andersen]
        notes: >
          Nose-Hoover is RECOMMENDED for production MD — it correctly
          samples the canonical (NVT) ensemble and produces physically
          meaningful temperature fluctuations. v-rescale is acceptable
          and widely used but introduces a stochastic term.
          Berendsen is FORBIDDEN for production — it suppresses energy
          fluctuations and does not sample the correct ensemble, leading
          to artifacts in thermodynamic properties.

      tc-grps:
        type: string
        required: true
        recommended_values:
          - "Protein Non-Protein"
        notes: >
          Must be consistent with equilibration phases.
          Changing coupling groups between phases introduces artifacts.

      tau-t:
        type: float
        required: true
        min: 0.1
        max: 2.0
        recommended: 0.5
        unit: ps
        notes: >
          0.5 ps recommended for Nose-Hoover in production (longer than
          equilibration to allow correct ensemble fluctuations).
          0.1 ps acceptable for v-rescale. Longer tau-t = weaker coupling
          = more physical dynamics but slower temperature control.

      ref-t:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        notes: Must be identical to equilibration phases.

  pressure_coupling:
    parameters:
      pcoupl:
        type: enum
        required: true
        allowed_values: [parrinello-rahman, c-rescale]
        recommended: parrinello-rahman
        forbidden_values: [no, berendsen, mttk]
        notes: >
          Parrinello-Rahman is MANDATORY for production NPT — it correctly
          samples the isothermal-isobaric ensemble. Berendsen is FORBIDDEN
          for production as it does not produce correct pressure fluctuations
          and leads to artifacts in compressibility and volume fluctuations.
          c-rescale (GROMACS 2021+) is an excellent alternative combining
          correct ensemble sampling with better stability.

      pcoupltype:
        type: enum
        required: true
        allowed_values: [isotropic, semiisotropic]
        recommended: isotropic
        notes: >
          Must be consistent with NPT equilibration phase.
          isotropic for globular proteins; semiisotropic for membranes.

      tau-p:
        type: float
        required: true
        min: 1.0
        max: 5.0
        recommended: 2.0
        unit: ps
        notes: >
          2.0 ps is standard for Parrinello-Rahman. Values below 1.0 ps
          can cause instability with Parrinello-Rahman, especially if
          starting from a system not fully equilibrated with this barostat.
          This is why Berendsen is used first during NPT equilibration.

      ref-p:
        type: float
        required: true
        min: 0.5
        max: 2.0
        recommended: 1.0
        unit: bar
        notes: Must be identical to NPT equilibration phase.

      compressibility:
        type: float
        required: true
        min: 1.0e-6
        max: 1.0e-3
        recommended: 4.5e-5
        unit: bar^-1
        notes: Must be identical to NPT equilibration phase.

  velocity_generation:
    parameters:
      gen-vel:
        type: enum
        required: true
        allowed_values: [no]
        forbidden_values: [yes]
        notes: >
          MUST be 'no' — velocities read from NPT checkpoint.
          Regenerating velocities for production would discard all
          equilibration and introduce severe artifacts.

  constraints:
    parameters:
      constraints:
        type: enum
        required: true
        allowed_values: [h-bonds, all-bonds]
        recommended: h-bonds
        forbidden_values: [none]
        notes: Must be consistent with equilibration phases.

      constraint-algorithm:
        type: enum
        required: true
        allowed_values: [LINCS, SHAKE]
        recommended: LINCS
        notes: Must be consistent with equilibration phases.

      lincs-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          Increase to 6 for production runs if any LINCS warnings
          were observed during equilibration.

      lincs-iter:
        type: integer
        required: false
        min: 1
        max: 2
        recommended: 1
        notes: Standard value. Increase to 2 only if LINCS warnings persist.

  position_restraints:
    parameters:
      define:
        type: string
        required: true
        allowed_values: [""]
        forbidden_values: ["-DPOSRES", "-DPOSRES_HEAVY"]
        notes: >
          Position restraints MUST be removed for production MD.
          Any remaining restraints would artificially constrain the
          system and invalidate all structural and dynamic analysis.
          This is one of the most common and impactful mistakes in
          MD simulation setup.

  cross_phase_consistency:
    description: >
      Parameters that must be identical to equilibration phases.
      Checked by the context propagation tool in Layer 2.
    must_match_all_phases:
      - rcoulomb
      - rvdw
      - coulombtype
      - vdwtype
      - pme-order
      - fourierspacing
      - constraints
      - constraint-algorithm
      - DispCorr
    must_match_nvt_npt:
      - ref-t
      - tc-grps
    must_match_npt:
      - ref-p
      - compressibility
      - pcoupltype
    barostat_progression:
      npt_equilibration: [berendsen, c-rescale]
      production_md: [parrinello-rahman, c-rescale]
      notes: >
        The Berendsen to Parrinello-Rahman progression is a
        well-established best practice. Using Parrinello-Rahman
        directly from a poorly equilibrated structure causes large
        pressure oscillations and potential simulation crashes.