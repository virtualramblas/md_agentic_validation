production_md:
  description: >
    Production MD phase. The simulation from which all
    scientific analysis is performed. Must follow
    successful NPT equilibration with converged
    temperature and density. Position restraints MUST
    be removed. Velocities are read from the NPT
    checkpoint file — they must NOT be regenerated.
    The barostat must be switched from Berendsen to
    Parrinello-Rahman (or c-rescale) to correctly
    sample the NPT ensemble. All MDP parameters must
    be identical to NPT equilibration except for the
    barostat, position restraints, and nsteps.

  prerequisites:
    must_follow: npt_equilibration
    required_input_files:
      - npt.gro
      - npt.cpt
      - topol.top
    continuation: true
    posre_itp_required: false
    notes: >
      Production MD continues from the NPT checkpoint.
      The -t npt.cpt flag in gmx grompp reads velocities
      from the NPT checkpoint. The -c npt.gro flag
      provides the final NPT coordinates. The posre.itp
      file is NOT required — position restraints must
      be absent in production MD. Verify that density
      and temperature have converged in the NPT phase
      before starting production.

  run_control:
    parameters:
      integrator:
        type: enum
        required: true
        allowed_values:
          - md
          - sd
        forbidden_values:
          - steep
          - cg
          - l-bfgs
        recommended: md
        notes: >
          md (leap-frog integrator) is the standard
          choice. Must match the integrator used in
          NVT and NPT equilibration phases for
          thermodynamic consistency.

      nsteps:
        type: integer
        required: true
        min: 500000
        max: 500000000
        recommended: 5000000
        notes: >
          Number of MD steps. With dt = 0.002 ps,
          5000000 steps = 10 ns. Minimum recommended
          production length is 1 ns (500000 steps).
          Typical production runs are 10-100 ns.
          Required length depends on the process
          being studied:
            local side-chain rotations: 1-10 ns
            loop motions: 10-100 ns
            domain motions: 100+ ns
          Always perform convergence analysis
          (block averaging of RMSD, Rg, energies)
          to verify sufficient sampling.

      dt:
        type: float
        required: true
        min: 0.0005
        max: 0.004
        recommended: 0.002
        unit: ps
        notes: >
          Integration timestep. Must be identical to
          NVT and NPT equilibration. 0.002 ps (2 fs)
          is standard with h-bonds constraints.

      continuation:
        type: enum
        required: true
        allowed_values:
          - "yes"
        forbidden_values:
          - "no"
        recommended: "yes"
        notes: >
          MUST be "yes". Production MD continues from
          the NPT checkpoint. Setting continuation =
          "no" would cause GROMACS to apply constraints
          to the initial coordinates, which is
          incorrect when continuing from a checkpoint.

  output_control:
    parameters:
      nstlog:
        type: integer
        required: true
        min: 100
        max: 50000
        recommended: 5000
        notes: >
          Write to log file every nstlog steps.
          5000 steps = 10 ps with dt = 0.002 ps.
          Less frequent than equilibration to reduce
          log file size for long production runs.

      nstenergy:
        type: integer
        required: true
        min: 100
        max: 50000
        recommended: 5000
        notes: >
          Write energies to .edr file every nstenergy
          steps. 5000 steps = 10 ps with dt = 0.002 ps.
          Energy data is used for thermodynamic
          analysis and convergence monitoring.

      nstxout-compressed:
        type: integer
        required: true
        min: 100
        max: 50000
        recommended: 5000
        notes: >
          Write compressed trajectory every N steps.
          5000 steps = 10 ps with dt = 0.002 ps.
          One frame every 10 ps is standard for most
          structural analyses. Use 500 steps (1 ps)
          for fast processes or detailed kinetic
          analysis. Use 50000 steps (100 ps) for
          very long runs where storage is a concern.

      nstxout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Write full-precision coordinates every N
          steps. 0 disables full-precision output —
          use compressed output (nstxout-compressed)
          instead for storage efficiency. Enable only
          if full precision is required for specific
          analyses.

      nstvout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Write velocities every N steps. 0 disables
          velocity output. Enable only if velocity
          data is required for specific analyses
          (e.g. velocity autocorrelation functions).

      nstfout:
        type: integer
        required: false
        min: 0
        max: 50000
        recommended: 0
        notes: >
          Write forces every N steps. 0 disables
          force output. Enable only if force data
          is required for specific analyses.

  neighbor_searching:
    parameters:
      cutoff-scheme:
        type: enum
        required: true
        allowed_values:
          - Verlet
        forbidden_values:
          - group
        recommended: Verlet
        notes: >
          Verlet is mandatory. Must match all
          equilibration phases.

      nstlist:
        type: integer
        required: true
        min: 10
        max: 40
        recommended: 10
        notes: >
          Update neighbor list every nstlist steps.
          10 is standard with the Verlet scheme.
          Must match equilibration phases.

      rcoulomb:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        notes: >
          Coulomb cutoff. MUST be identical to the
          values used in NVT and NPT equilibration.
          Changing cutoffs between phases introduces
          energy discontinuities and invalidates
          the equilibration.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb
        notes: >
          VdW cutoff. Must equal rcoulomb and must
          be identical to all equilibration phases.

      pbc:
        type: enum
        required: true
        allowed_values:
          - xyz
        forbidden_values:
          - "no"
          - xy
        recommended: xyz
        notes: >
          Full 3D periodic boundary conditions.
          Mandatory for all explicit solvent
          simulations.

  electrostatics:
    parameters:
      coulombtype:
        type: enum
        required: true
        allowed_values:
          - PME
        forbidden_values:
          - Cut-off
          - Reaction-Field
        recommended: PME
        notes: >
          PME is mandatory. Must match all
          equilibration phases.

      pme-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          PME interpolation order. Must match all
          equilibration phases.

      fourierspacing:
        type: float
        required: false
        min: 0.1
        max: 0.2
        recommended: 0.16
        unit: nm
        notes: >
          Grid spacing for PME FFT. Must match all
          equilibration phases.

  vdw:
    parameters:
      vdwtype:
        type: enum
        required: true
        allowed_values:
          - Cut-off
          - PME
        recommended: Cut-off
        notes: >
          Must match all equilibration phases.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb

      vdw-modifier:
        type: enum
        required: false
        allowed_values:
          - Potential-shift
          - Force-switch
          - Potential-switch
          - None
        recommended: Potential-shift
        notes: >
          Must match all equilibration phases.
          Potential-shift for AMBER/OPLS/GROMOS.
          Force-switch for CHARMM36/36m.

      DispCorr:
        type: enum
        required: false
        allowed_values:
          - "no"
          - EnerPres
          - Ener
        recommended: EnerPres
        notes: >
          Must match all equilibration phases.
          EnerPres for AMBER/OPLS/GROMOS. Must be
          "no" for CHARMM36/36m. Critical for
          correct density and pressure in NPT
          production simulations.

  temperature_coupling:
    parameters:
      tcoupl:
        type: enum
        required: true
        allowed_values:
          - nose-hoover
          - v-rescale
          - andersen
        forbidden_values:
          - berendsen
          - "no"
        recommended: nose-hoover
        notes: >
          Nose-Hoover is the recommended thermostat
          for production MD — it correctly samples
          the canonical ensemble and produces correct
          kinetic energy fluctuations. v-rescale is
          an acceptable alternative. Berendsen is
          FORBIDDEN in production MD — it does not
          sample the correct ensemble and produces
          incorrect heat capacity and temperature
          fluctuation statistics. MUST NOT be "no".

      tc-grps:
        type: string
        required: true
        allowed_values:
          - Protein Non-Protein
          - Protein_DNA Non-Protein
          - System
        recommended: Protein Non-Protein
        notes: >
          Must match equilibration tc-grps setting
          exactly. Changing coupling groups between
          phases is not permitted.

      tau-t:
        type: float
        required: true
        min: 0.1
        max: 2.0
        recommended: 0.5
        unit: ps
        notes: >
          Temperature coupling time constant.
          0.5-1.0 ps is recommended for Nose-Hoover
          in production MD. 0.1 ps is acceptable for
          v-rescale. Longer time constants give
          weaker coupling and more physical kinetic
          energy fluctuations.

      ref-t:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        notes: >
          Target temperature. MUST be identical to
          the ref-t values used in NVT and NPT
          equilibration. Temperature inconsistency
          across phases is a critical error.

  pressure_coupling:
    parameters:
      pcoupl:
        type: enum
        required: true
        allowed_values:
          - parrinello-rahman
          - c-rescale
          - mttk
        forbidden_values:
          - berendsen
          - "no"
        recommended: parrinello-rahman
        notes: >
          Parrinello-Rahman is the recommended
          barostat for production MD — it correctly
          samples the isothermal-isobaric (NPT)
          ensemble and produces correct volume and
          pressure fluctuation statistics. c-rescale
          (GROMACS 2021+) is an acceptable alternative
          that also samples the correct ensemble.
          Berendsen is FORBIDDEN in production MD —
          it suppresses pressure fluctuations and
          produces incorrect compressibility and
          volume fluctuation statistics. MUST NOT
          be "no" for NPT production simulations.

      pcoupltype:
        type: enum
        required: true
        allowed_values:
          - isotropic
          - semiisotropic
          - anisotropic
        recommended: isotropic
        notes: >
          Must match NPT equilibration pcoupltype.
          isotropic for standard protein-water
          systems. semiisotropic for membrane systems.

      tau-p:
        type: float
        required: true
        min: 0.5
        max: 10.0
        recommended: 2.0
        unit: ps
        notes: >
          Pressure coupling time constant. 2.0 ps
          is standard for Parrinello-Rahman. Must
          match NPT equilibration value.

      ref-p:
        type: float
        required: true
        min: 0.5
        max: 2.0
        recommended: 1.0
        unit: bar
        notes: >
          Target pressure. MUST be identical to the
          ref-p value used in NPT equilibration.
          Pressure inconsistency between NPT and
          production is a critical error.

      compressibility:
        type: float
        required: true
        min: 1.0e-6
        max: 1.0e-4
        recommended: 4.5e-5
        unit: bar^-1
        notes: >
          Isothermal compressibility of water.
          MUST be identical to the value used in
          NPT equilibration.

  velocity_generation:
    parameters:
      gen-vel:
        type: enum
        required: true
        allowed_values:
          - "no"
        forbidden_values:
          - "yes"
        recommended: "no"
        notes: >
          MUST be "no". Velocities are read from the
          NPT checkpoint file specified with the -t
          flag in gmx grompp. Regenerating velocities
          would discard all equilibration and restart
          the simulation from scratch, invalidating
          the entire equilibration procedure.

  constraints:
    parameters:
      constraints:
        type: enum
        required: true
        allowed_values:
          - h-bonds
          - all-bonds
          - h-angles
          - all-angles
        forbidden_values:
          - none
        recommended: h-bonds
        notes: >
          Must be identical to NVT and NPT
          equilibration constraints setting. Changing
          constraints between phases alters the
          effective degrees of freedom and introduces
          thermodynamic inconsistencies.

      constraint-algorithm:
        type: enum
        required: false
        allowed_values:
          - LINCS
          - SHAKE
        recommended: LINCS
        notes: >
          Must match all equilibration phases.

      lincs-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          LINCS constraint order. 4 is standard.
          6 for higher accuracy in long production
          runs. Must match equilibration phases.

      lincs-iter:
        type: integer
        required: false
        min: 1
        max: 4
        recommended: 1
        notes: >
          Number of LINCS correction iterations.
          Must match equilibration phases.

  position_restraints:
    parameters:
      define:
        type: string
        required: true
        allowed_values:
          - ""
        forbidden_values:
          - -DPOSRES
          - -DPOSRES_HEAVY
        recommended: ""
        notes: >
          Position restraints MUST be absent in
          production MD. The define parameter must
          be empty or absent entirely. Position
          restraints artificially constrain the
          solute and prevent sampling of the true
          conformational ensemble. All structural
          and dynamic analysis from a restrained
          trajectory would be invalid — RMSD, RMSF,
          radius of gyration, and any conformational
          analysis would reflect the restrained
          rather than the free system.