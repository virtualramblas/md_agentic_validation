npt_equilibration:
  description: >
    NPT (constant Number of particles, Pressure,
    Temperature) equilibration phase. Brings the system
    to the target pressure and equilibrates the box
    volume after NVT equilibration has established the
    correct temperature. Must follow NVT equilibration.
    Velocities are read from the NVT checkpoint file —
    they must NOT be regenerated. Position restraints
    should remain active during NPT equilibration.
    Use Berendsen or c-rescale barostat for fast,
    stable pressure convergence — NOT Parrinello-Rahman,
    which can cause large pressure oscillations when
    the system is far from the target pressure.

  prerequisites:
    must_follow: nvt_equilibration
    required_input_files:
      - nvt.gro
      - nvt.cpt
      - topol.top
      - posre.itp
    continuation: true
    posre_itp_required: true
    notes: >
      NPT equilibration continues from the NVT
      checkpoint. The -t nvt.cpt flag in gmx grompp
      reads velocities from the NVT checkpoint.
      The -c nvt.gro flag provides the final NVT
      coordinates. Both are required.

  run_control:
    parameters:
      integrator:
        type: enum
        required: true
        allowed_values:
          - md
          - sd
        forbidden_values:
          - steep
          - cg
          - l-bfgs
        recommended: md
        notes: >
          md (leap-frog integrator) is the standard
          choice. Must match the integrator used in
          NVT equilibration for thermodynamic
          consistency.

      nsteps:
        type: integer
        required: true
        min: 25000
        max: 1000000
        recommended: 50000
        notes: >
          Number of MD steps. With dt = 0.002 ps,
          50000 steps = 100 ps. 100 ps is the minimum
          recommended NPT equilibration time for
          density convergence in simple protein-water
          systems. Use 500 ps to 2 ns for membrane
          systems or large complexes. Always verify
          density convergence before proceeding to
          production MD.

      dt:
        type: float
        required: true
        min: 0.0005
        max: 0.004
        recommended: 0.002
        unit: ps
        notes: >
          Integration timestep. Must match the
          timestep used in NVT equilibration.
          0.002 ps (2 fs) is standard with h-bonds
          constraints.

      continuation:
        type: enum
        required: true
        allowed_values:
          - "yes"
        forbidden_values:
          - "no"
        recommended: "yes"
        notes: >
          MUST be "yes". NPT equilibration continues
          from the NVT checkpoint. Setting continuation
          = "no" would cause GROMACS to apply
          constraints to the initial coordinates,
          which is incorrect when continuing from
          a checkpoint.

  output_control:
    parameters:
      nstlog:
        type: integer
        required: true
        min: 100
        max: 10000
        recommended: 500
        notes: >
          Write to log file every nstlog steps.
          500 steps = 1 ps with dt = 0.002 ps.

      nstenergy:
        type: integer
        required: true
        min: 100
        max: 10000
        recommended: 500
        notes: >
          Write energies to .edr file every nstenergy
          steps. 500 is standard. Density and pressure
          are written to the .edr file and must be
          monitored for convergence.

      nstxout-compressed:
        type: integer
        required: true
        min: 0
        max: 10000
        recommended: 500
        notes: >
          Write compressed trajectory every N steps.
          500 steps = 1 ps with dt = 0.002 ps.

  neighbor_searching:
    parameters:
      cutoff-scheme:
        type: enum
        required: true
        allowed_values:
          - Verlet
        forbidden_values:
          - group
        recommended: Verlet
        notes: >
          Verlet is mandatory. Must match all other
          phases.

      nstlist:
        type: integer
        required: true
        min: 10
        max: 40
        recommended: 10
        notes: >
          Update neighbor list every nstlist steps.
          10 is standard with the Verlet scheme.
          Must match NVT equilibration setting.

      rcoulomb:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        notes: >
          Coulomb cutoff. Must be identical to the
          value used in NVT equilibration and
          production MD. Changing cutoffs between
          phases introduces energy discontinuities.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb
        notes: >
          VdW cutoff. Must equal rcoulomb and must
          be identical to NVT and production values.

      pbc:
        type: enum
        required: true
        allowed_values:
          - xyz
        forbidden_values:
          - "no"
          - xy
        recommended: xyz
        notes: >
          Full 3D periodic boundary conditions.
          Mandatory for all explicit solvent
          simulations.

  electrostatics:
    parameters:
      coulombtype:
        type: enum
        required: true
        allowed_values:
          - PME
        forbidden_values:
          - Cut-off
          - Reaction-Field
        recommended: PME
        notes: >
          PME is mandatory. Must match all other
          phases.

      pme-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          PME interpolation order. Must match all
          other phases.

      fourierspacing:
        type: float
        required: false
        min: 0.1
        max: 0.2
        recommended: 0.16
        unit: nm
        notes: >
          Grid spacing for PME FFT. Must match all
          other phases.

  vdw:
    parameters:
      vdwtype:
        type: enum
        required: true
        allowed_values:
          - Cut-off
          - PME
        recommended: Cut-off
        notes: >
          Must match NVT equilibration and production
          MD settings.

      rvdw:
        type: float
        required: true
        min: 0.8
        max: 1.6
        recommended: 1.0
        unit: nm
        must_equal: rcoulomb

      vdw-modifier:
        type: enum
        required: false
        allowed_values:
          - Potential-shift
          - Force-switch
          - Potential-switch
          - None
        recommended: Potential-shift
        notes: >
          Must match NVT equilibration and production
          MD settings. Potential-shift for
          AMBER/OPLS/GROMOS. Force-switch for
          CHARMM36/36m.

      DispCorr:
        type: enum
        required: false
        allowed_values:
          - "no"
          - EnerPres
          - Ener
        recommended: EnerPres
        notes: >
          Long-range dispersion correction. EnerPres
          is critical for correct density and pressure
          in NPT simulations with AMBER/OPLS/GROMOS.
          Must be "no" for CHARMM36/36m. Must match
          NVT equilibration and production MD settings.

  temperature_coupling:
    parameters:
      tcoupl:
        type: enum
        required: true
        allowed_values:
          - v-rescale
          - berendsen
          - nose-hoover
          - andersen
        forbidden_values:
          - "no"
        recommended: v-rescale
        notes: >
          Temperature coupling is mandatory during
          NPT equilibration. v-rescale is recommended
          for equilibration. Must match NVT
          equilibration thermostat for consistency.
          MUST NOT be "no".

      tc-grps:
        type: string
        required: true
        allowed_values:
          - Protein Non-Protein
          - Protein_DNA Non-Protein
          - System
        recommended: Protein Non-Protein
        notes: >
          Must match NVT equilibration tc-grps
          setting exactly.

      tau-t:
        type: float
        required: true
        min: 0.01
        max: 2.0
        recommended: 0.1
        unit: ps
        notes: >
          Temperature coupling time constant.
          Must match NVT equilibration value.

      ref-t:
        type: float
        required: true
        min: 270.0
        max: 370.0
        recommended: 300.0
        unit: K
        notes: >
          Target temperature. MUST be identical to
          the ref-t value used in NVT equilibration
          and production MD. Temperature inconsistency
          across phases is a critical error.

  pressure_coupling:
    parameters:
      pcoupl:
        type: enum
        required: true
        allowed_values:
          - berendsen
          - c-rescale
          - parrinello-rahman
        forbidden_values:
          - "no"
          - mttk
        recommended: berendsen
        notes: >
          Pressure coupling is mandatory during NPT
          equilibration. Berendsen is strongly
          recommended for NPT equilibration — it
          converges quickly and stably even when the
          system is far from the target pressure.
          c-rescale (GROMACS 2021+) is an acceptable
          alternative. Parrinello-Rahman is NOT
          recommended for equilibration — it can
          cause large pressure oscillations and
          simulation instability when the system is
          far from equilibrium. Switch to
          Parrinello-Rahman for production MD.

      pcoupltype:
        type: enum
        required: true
        allowed_values:
          - isotropic
          - semiisotropic
          - anisotropic
        recommended: isotropic
        notes: >
          isotropic for standard protein-water
          systems. semiisotropic for membrane systems
          (independent XY and Z coupling). anisotropic
          for crystal simulations.

      tau-p:
        type: float
        required: true
        min: 0.5
        max: 5.0
        recommended: 2.0
        unit: ps
        notes: >
          Pressure coupling time constant. 2.0 ps is
          standard for Berendsen during equilibration.
          Use 2.0 ps for Parrinello-Rahman in
          production MD.

      ref-p:
        type: float
        required: true
        min: 0.5
        max: 2.0
        recommended: 1.0
        unit: bar
        notes: >
          Target pressure. 1.0 bar is standard
          physiological pressure. Must be identical
          to the ref-p value used in production MD.

      compressibility:
        type: float
        required: true
        min: 1.0e-6
        max: 1.0e-4
        recommended: 4.5e-5
        unit: bar^-1
        notes: >
          Isothermal compressibility of water.
          4.5e-5 bar^-1 is the standard value for
          liquid water at 300 K. Must be identical
          to the value used in production MD.

  velocity_generation:
    parameters:
      gen-vel:
        type: enum
        required: true
        allowed_values:
          - "no"
        forbidden_values:
          - "yes"
        recommended: "no"
        notes: >
          MUST be "no". Velocities are read from the
          NVT checkpoint file specified with the -t
          flag in gmx grompp. Regenerating velocities
          would discard all NVT equilibration and
          restart the simulation from scratch.

  constraints:
    parameters:
      constraints:
        type: enum
        required: true
        allowed_values:
          - h-bonds
          - all-bonds
          - h-angles
          - all-angles
        forbidden_values:
          - none
        recommended: h-bonds
        notes: >
          Must match NVT equilibration constraints
          setting. Changing constraints between phases
          alters the effective degrees of freedom and
          introduces thermodynamic inconsistencies.

      constraint-algorithm:
        type: enum
        required: false
        allowed_values:
          - LINCS
          - SHAKE
        recommended: LINCS
        notes: >
          Must match NVT equilibration setting.

      lincs-order:
        type: integer
        required: false
        min: 4
        max: 8
        recommended: 4
        notes: >
          Must match NVT equilibration setting.

      lincs-iter:
        type: integer
        required: false
        min: 1
        max: 4
        recommended: 1
        notes: >
          Must match NVT equilibration setting.

  position_restraints:
    parameters:
      define:
        type: string
        required: false
        allowed_values:
          - -DPOSRES
          - -DPOSRES_HEAVY
          - ""
        recommended: -DPOSRES
        notes: >
          Position restraints should remain active
          during NPT equilibration. The system needs
          time to equilibrate the box volume and
          density with the solute restrained. Removing
          position restraints before density has
          converged can lead to poor starting
          conditions for production MD. Position
          restraints are removed in the production
          MD phase.